name = "family-memory-assistant"
main = "src/index.ts"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "family-memory"
database_id = "4000beb9-0ae2-412d-9b95-af0c468a8688"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
FAMILY_TIMEZONE = "Australia/Sydney"
DATE_LOCALE = "en-AU"
AMBIGUOUS_NUMERIC_DATE_POLICY = "clarify"
WHATSAPP_TRANSPORT = "twilio"
DETERMINISTIC_MIN_TOPIC_TERM_LENGTH = "3"
DETERMINISTIC_ENABLE_WAITING_FACTS = "true"
DETERMINISTIC_ENABLE_FACT_RESOLUTION = "true"
DETERMINISTIC_ENABLE_REMINDER_CREATION = "false"
DETERMINISTIC_POLITE_FILLERS = "please,kindly"
DETERMINISTIC_TOPIC_STOP_WORDS = "a,an,are,at,for,in,is,my,on,the,to,was,were"

# The Compose development command selects this environment so local-only
# routes and the Dojo adapter are available without changing production vars.
[env.local]
name = "family-memory-assistant-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "family-memory"
database_id = "4000beb9-0ae2-412d-9b95-af0c468a8688"
migrations_dir = "migrations"

[env.local.vars]
ENVIRONMENT = "development"
FAMILY_TIMEZONE = "Australia/Sydney"
DATE_LOCALE = "en-AU"
AMBIGUOUS_NUMERIC_DATE_POLICY = "clarify"
WHATSAPP_TRANSPORT = "dojo"
DETERMINISTIC_MIN_TOPIC_TERM_LENGTH = "3"
DETERMINISTIC_ENABLE_WAITING_FACTS = "true"
DETERMINISTIC_ENABLE_FACT_RESOLUTION = "true"
DETERMINISTIC_ENABLE_REMINDER_CREATION = "false"
DETERMINISTIC_POLITE_FILLERS = "please,kindly"
DETERMINISTIC_TOPIC_STOP_WORDS = "a,an,are,at,for,in,is,my,on,the,to,was,were"
