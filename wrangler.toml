name = "family-memory-assistant"
main = "src/index.ts"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "family-memory"
database_id = "4000beb9-0ae2-412d-9b95-af0c468a8688"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
FAMILY_TIMEZONE = "Australia/Brisbane"
DATE_LOCALE = "en-AU"
AMBIGUOUS_NUMERIC_DATE_POLICY = "clarify"
CLARIFICATION_TTL_MINUTES = "30"
MAX_CLARIFICATION_TURNS = "2"
WHATSAPP_TRANSPORT = "twilio"
TWILIO_STATUS_CALLBACK_URL = "https://family-memory-assistant.tim-j-durrant.workers.dev/webhooks/twilio/status"
EMERGENCY_NOTIFICATION_MODE = "disabled"
DETERMINISTIC_MIN_TOPIC_TERM_LENGTH = "3"
DETERMINISTIC_ENABLE_WAITING_FACTS = "true"
DETERMINISTIC_ENABLE_FACT_RESOLUTION = "true"
DETERMINISTIC_ENABLE_REMINDER_CREATION = "true"
DEFAULT_REMINDER_TIME = "08:00"
DETERMINISTIC_FACT_CONFLICT_POLICY = "confirm"
DETERMINISTIC_FACT_DELETE_POLICY = "confirm"
DETERMINISTIC_FACT_CONFIRMATION_TTL_MINUTES = "30"
DETERMINISTIC_POLITE_FILLERS = "please,kindly"
DETERMINISTIC_TOPIC_STOP_WORDS = "a,an,are,at,for,in,is,my,on,the,to,was,were"
DETERMINISTIC_PERSON_ATTRIBUTES = "hair=hair_length,eyes=eye_colour"

# The Compose development command selects this environment so local-only
# routes and the Dojo adapter are available without changing production vars.
[env.local]
name = "family-memory-assistant-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "family-memory"
database_id = "4000beb9-0ae2-412d-9b95-af0c468a8688"
migrations_dir = "migrations"

[env.local.vars]
ENVIRONMENT = "development"
FAMILY_TIMEZONE = "Australia/Brisbane"
DATE_LOCALE = "en-AU"
AMBIGUOUS_NUMERIC_DATE_POLICY = "clarify"
CLARIFICATION_TTL_MINUTES = "30"
MAX_CLARIFICATION_TURNS = "2"
WHATSAPP_TRANSPORT = "dojo"
EMERGENCY_NOTIFICATION_MODE = "dry-run"
DETERMINISTIC_MIN_TOPIC_TERM_LENGTH = "3"
DETERMINISTIC_ENABLE_WAITING_FACTS = "true"
DETERMINISTIC_ENABLE_FACT_RESOLUTION = "true"
DETERMINISTIC_ENABLE_REMINDER_CREATION = "false"
DETERMINISTIC_FACT_CONFLICT_POLICY = "confirm"
DETERMINISTIC_FACT_DELETE_POLICY = "confirm"
DETERMINISTIC_FACT_CONFIRMATION_TTL_MINUTES = "30"
DETERMINISTIC_POLITE_FILLERS = "please,kindly"
DETERMINISTIC_TOPIC_STOP_WORDS = "a,an,are,at,for,in,is,my,on,the,to,was,were"
DETERMINISTIC_PERSON_ATTRIBUTES = "hair=hair_length,eyes=eye_colour"

[env.meta-test.vars]
CLARIFICATION_TTL_MINUTES = "30"
MAX_CLARIFICATION_TURNS = "2"
WHATSAPP_TRANSPORT = "dojo"
DETERMINISTIC_MIN_TOPIC_TERM_LENGTH = "3"
DETERMINISTIC_ENABLE_WAITING_FACTS = "true"
DETERMINISTIC_ENABLE_FACT_RESOLUTION = "true"
DETERMINISTIC_ENABLE_REMINDER_CREATION = "false"
DETERMINISTIC_FACT_CONFLICT_POLICY = "confirm"
DETERMINISTIC_FACT_DELETE_POLICY = "confirm"
DETERMINISTIC_FACT_CONFIRMATION_TTL_MINUTES = "30"
DETERMINISTIC_POLITE_FILLERS = "please,kindly"
DETERMINISTIC_TOPIC_STOP_WORDS = "a,an,are,at,for,in,is,my,on,the,to,was,were"
DETERMINISTIC_PERSON_ATTRIBUTES = "hair=hair_length,eyes=eye_colour"
